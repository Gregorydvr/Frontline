name: Check

on:
  pull_request:
  # Also after each merge, since two green pull requests can still make main red.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Wrangler sends no usage data to Cloudflare from the check, and does
      # not download Cloudflare's example request details.
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      # Pinned to exact commits, so a changed tag cannot change what runs here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The owner's screens in a real browser, at a phone's size and a
      # laptop's: no sideways scroll, nothing under 44px, nothing cut off, and
      # no accessibility failures. The browser is the one the pinned
      # Playwright version comes with.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:screens
