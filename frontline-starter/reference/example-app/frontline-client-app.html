/* Layout: a phone-first app. One column of cards on cream with a fixed Send bar at the bottom;
   from 960px a side menu and a wider main column. One light look, taken from the Front-line website. */
:root{
  --cream:#FBF4EB; --cream-deep:#F5ECE1; --card:#FFFDF9;
  --ink:#20273E; --ink-2:#4A4F63;
  --line:rgba(32,39,62,.12); --line-strong:rgba(32,39,62,.26);
  --teal:#2B7E85; --teal-tint:#E4EFEC;
  --peach-tint:#FFE6D7; --error:#B42318; --error-tint:#FCEDEB;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bar:0px; --side:0px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
p,li,span{text-wrap:pretty}
:focus{outline:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
h1:focus-visible{outline:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.i{width:20px;height:20px;flex:none}
.i-16{width:16px;height:16px;flex:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Shell */
.app{display:flex;flex-direction:column}
.app[data-bar="send"]{--bar:80px}
.app[data-bar="actions"]{--bar:146px}
.side{display:none}
.main{min-width:0;padding-inline:16px;padding-bottom:calc(var(--bar) + 28px + env(safe-area-inset-bottom,0px))}
.screen{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding-block:4px 8px}

/* Type */
h1{font-size:26px;line-height:1.12;letter-spacing:-.025em;font-weight:740}
h2{font-size:19px;line-height:1.25;letter-spacing:-.01em;font-weight:700}
.meta{color:var(--ink-2)}
.badge{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--teal);border-radius:999px;padding:4px 9px}

/* Top of Home on a phone */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.top-acts{display:flex;gap:8px}
.logo{width:96px;height:19px;flex:none}
.hello{display:flex;flex-direction:column;gap:2px}
.firm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:10px;font-weight:600;font-size:16px;line-height:1.1;text-decoration:none;white-space:nowrap}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-ink:hover{background:#151A2C}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:#246A70}
.btn-line{background:transparent;border:1.5px solid var(--line-strong)}
.btn-line:hover{background:rgba(32,39,62,.05)}
.btn-lg{min-height:56px;font-size:18px;border-radius:12px}
.btn-sm{padding:0 12px;gap:6px}
.btn-block{width:100%}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:none;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 0;border:0;background:none;font-weight:600;align-self:flex-start}
.find{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--card);color:var(--ink-2);text-align:left}
input.find{color:var(--ink)}
input.find::placeholder{color:var(--ink-2);opacity:1}

/* Blocks, cards and rows */
.block{display:flex;flex-direction:column;gap:8px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.head .link{margin-block:-7px}
.count{color:var(--ink-2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border:0;background:none;text-align:left}
.row + .row{border-top:1px solid var(--line)}
button.row:hover{background:rgba(32,39,62,.035)}
button.row:focus-visible{outline-offset:-3px;border-radius:12px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-weight:600}
.t2{color:var(--ink-2)}
.tile{width:40px;height:40px;border-radius:11px;background:var(--teal-tint);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:25px;height:25px}
.chev{color:var(--ink-2)}
.empty{padding:16px 14px;color:var(--ink-2)}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* Status chips: a word, a colour and an icon together */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 7px;border-radius:999px;font-size:15px;font-weight:600;line-height:20px;white-space:nowrap;align-self:flex-start}
.chip-ok{background:var(--peach-tint)}
.chip-good{background:var(--teal-tint)}
.chip-good .i-16{color:var(--teal)}
.chip-plain{background:var(--cream-deep)}
.chip-bad{background:var(--error-tint);color:var(--error)}

/* Done for you */
.feed{display:flex;flex-direction:column}
.feed li + li{border-top:1px solid var(--line)}
.fb{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:44px;padding:8px 0;border:0;background:none;text-align:left}
button.fb:hover .ft{text-decoration:underline;text-underline-offset:3px}
.fb .tick{color:var(--teal);margin-top:1px}
.ft{flex:1;min-width:0}
.fb time{color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}

/* Money */
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fig{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--cream-deep)}
.fig b{font-size:21px;line-height:1.2;font-weight:740;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fig.bad b{color:var(--error)}
.kv li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 14px}
.kv li + li{border-top:1px solid var(--line)}
.kv b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Review */
.total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.total b{font-size:40px;line-height:1.05;font-weight:740;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ticks{display:flex;flex-direction:column;gap:6px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks .i{color:var(--teal);margin-top:1px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--peach-tint)}
.flag .i{margin-top:1px}
.quote{padding:12px 14px;border-radius:12px;background:var(--cream-deep)}

/* Job timeline */
.day{font-weight:700;padding:14px 14px 2px}
.tl li{display:flex;flex-direction:column;gap:6px;padding:10px 14px}
.tl li + li{border-top:1px solid var(--line)}
.tl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl-top time{color:var(--ink-2);font-variant-numeric:tabular-nums}
.who{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:15px;font-weight:600;line-height:20px}
.who-fl{background:var(--teal-tint)}
.who-you{background:var(--peach-tint)}
.who-cust{background:var(--cream-deep)}

/* Bottom bar and toast */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--cream);border-top:1px solid var(--line)}
.bar-in{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:calc(var(--side) + 16px);right:16px;bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;pointer-events:none}
.toast-in{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:520px;padding:8px 8px 8px 16px;border-radius:12px;background:var(--ink);color:var(--cream);box-shadow:0 8px 24px rgba(16,22,42,.25)}
.toast-in span{flex:1;min-width:0;padding-block:6px}
.toast-btn{min-height:44px;padding:0 14px;border-radius:9px;border:1.5px solid rgba(251,244,235,.55);background:none;color:var(--cream);font-weight:600;white-space:nowrap}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(16,22,42,.5)}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 40px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:var(--cream);animation:rise .18s ease-out}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-10px;border:0;border-radius:10px;background:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field input,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--card)}
.field textarea{min-height:110px;resize:vertical}
.rec{display:flex;align-items:center;justify-content:center;gap:5px;height:60px}
.rec i{display:block;width:5px;height:14px;border-radius:3px;background:var(--teal);animation:pulse 1s ease-in-out infinite}
.rec i:nth-child(3n){animation-delay:.2s}
.rec i:nth-child(3n+1){animation-delay:.45s}
.timer{font-size:34px;font-weight:740;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bigtick{width:56px;height:56px;border-radius:50%;background:var(--teal-tint);color:var(--teal);display:flex;align-items:center;justify-content:center}
.bigtick svg{width:30px;height:30px}
.bubble{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:16px 16px 16px 4px;background:var(--card)}
.mini{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--cream)}
.mini .btn{pointer-events:none}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{height:12px}50%{height:46px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.rec i{animation:none;height:28px}}

/* Laptop. The film's phone (.film-app) is left out, so it keeps the phone layout at any window size. */
@media (min-width:960px){
  .app:not(.film-app){--side:296px;flex-direction:row;align-items:flex-start}
  .app:not(.film-app)[data-bar="send"]{--bar:0px}
  .app:not(.film-app) .side{display:flex;flex-direction:column;gap:4px;flex:none;width:var(--side);position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;background:var(--cream-deep);border-right:1px solid var(--line)}
  .app:not(.film-app) .side-brand{display:flex;flex-direction:column;gap:12px;padding:0 10px 14px}
  .app:not(.film-app) .side .logo{width:112px;height:22px}
  .app:not(.film-app) .side-firm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
  .app:not(.film-app) .nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border:1.5px solid transparent;border-radius:10px;background:none;text-align:left}
  .app:not(.film-app) .nav:hover{background:rgba(32,39,62,.05)}
  .app:not(.film-app) .nav[aria-current="page"]{background:var(--card);border-color:var(--line-strong);font-weight:700}
  .app:not(.film-app) .nav .i{color:var(--teal);width:22px;height:22px}
  .app:not(.film-app) .nav span{flex:1;min-width:0}
  .app:not(.film-app) .nav b{flex:none;min-width:24px;padding:0 7px;border-radius:12px;background:var(--ink);color:var(--cream);font-size:15px;font-weight:700;line-height:24px;text-align:center}
  .app:not(.film-app) .side hr{width:calc(100% - 20px);margin:8px 10px;border:0;border-top:1px solid var(--line)}
  .app:not(.film-app) .side-end{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
  .app:not(.film-app) .main{flex:1;padding:26px 40px 40px;padding-bottom:calc(var(--bar) + 40px)}
  .app:not(.film-app) .screen{margin-inline:0;max-width:760px;gap:24px}
  .app:not(.film-app) .screen.wide{max-width:1040px}
  .app:not(.film-app) .top,.app:not(.film-app) .only-phone{display:none}
  .app:not(.film-app) .home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
  .app:not(.film-app) .home-grid > div{display:flex;flex-direction:column;gap:24px}
  .app:not(.film-app) .money{grid-template-columns:minmax(0,1fr)}
  .app:not(.film-app) .fig{flex-direction:row;align-items:baseline;justify-content:space-between;padding:14px 16px}
  .app:not(.film-app)[data-bar="send"] .bar{display:none}
  .app:not(.film-app) .bar{left:var(--side);padding-inline:40px}
  .app:not(.film-app) .bar-in{margin-inline:0;max-width:760px;flex-direction:row}
  .app:not(.film-app) .bar-in > .btn{flex:1}
  .app:not(.film-app) .bar-in .two{flex:1}
  .app:not(.film-app) .sheet-wrap{align-items:center}
  .app:not(.film-app) .sheet{border-radius:18px;padding:14px 22px 22px}
}
@media (max-width:959px){
  .home-grid,.home-grid > div{display:contents}
}
/* The film, version 2. A 1920x1080 stage scaled to fit the window, and it does not move: Tom's phone on
   the left, Front-line's column in the middle, the customer's phone on the right, for the whole film.
   The words sit in the middle column and stay there. One dark look, from the website's dark band, so the
   cream phones stand out. Everything on the stage is placed by film.js from one clock, so nothing here
   animates by itself. */
.film{
  --f-bg:#151C30; --f-bg-2:#1D2640; --f-ink:#FBF4EB; --f-dim:rgba(251,244,235,.68);
  --f-line:rgba(251,244,235,.16); --f-cyan:#66D8E8; --f-peach:#FFB18D; --f-phone:#090D18;
  --k:1;
  min-height:100vh; display:flex; flex-direction:column; gap:14px;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--f-bg); color:var(--f-ink); color-scheme:dark;
}
html.film-on body{background:#151C30}
.film :focus-visible{outline-color:var(--f-cyan)}
.film-fit{position:relative; width:100%; max-width:calc((100vh - 210px) * 16 / 9); min-width:0; margin-inline:auto; aspect-ratio:16 / 9; overflow:hidden; border-radius:10px; background:var(--f-bg)}
.film-stage{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; transform:scale(var(--k)); overflow:hidden; font-family:var(--font); line-height:1.2; color:var(--f-ink);
  background:radial-gradient(1200px 700px at 50% 38%, var(--f-bg-2), var(--f-bg) 70%)}
.film-stage *{animation:none !important; transition:none !important}
.film-fit:fullscreen{max-width:none; width:100%; height:100%; border-radius:0; aspect-ratio:auto}
.film.capture{padding:0; gap:0; min-height:0}
.film.capture .film-fit{max-width:none; width:1920px; height:1080px; margin:0; border-radius:0; aspect-ratio:auto}
.film.capture .film-ui{display:none}

/* Controls and script, outside the stage */
.film-bar{width:100%; max-width:calc((100vh - 210px) * 16 / 9); min-width:0; margin-inline:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.film-bar h1{font-size:19px; line-height:1.25; letter-spacing:-.01em; font-weight:700; color:var(--f-dim)}
.film-bar .btn{background:transparent; border:1.5px solid rgba(251,244,235,.4); color:var(--f-ink); padding-left:10px}
.film-bar .btn:hover{background:rgba(251,244,235,.08)}
.film.capture .film-bar{display:none}
.film-ctl .btn[aria-pressed="true"]{background:rgba(102,216,232,.16); border-color:var(--f-cyan)}
.film-ui{width:100%; max-width:calc((100vh - 210px) * 16 / 9); min-width:0; margin-inline:auto; display:flex; flex-direction:column; gap:14px}
.film-ctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.film-ctl .btn{background:transparent; border:1.5px solid rgba(251,244,235,.4); color:var(--f-ink)}
.film-ctl .btn:hover{background:rgba(251,244,235,.08)}
.film-ctl .btn.go{background:var(--f-ink); border-color:var(--f-ink); color:#20273E; min-width:104px}
.film-ctl .btn.go:hover{background:#fff}
.film-time{font-variant-numeric:tabular-nums; color:var(--f-dim); white-space:nowrap; margin-left:auto}
.film-seek{flex:1 1 220px; min-width:0; height:44px; accent-color:var(--f-cyan)}
.film-now{display:flex; flex-direction:column; gap:4px; min-height:74px}
.film-now b{font-weight:700}
.film-now p{color:var(--f-dim); max-width:70ch}
.film-script{border-top:1px solid var(--f-line); padding-top:14px; display:flex; flex-direction:column; gap:10px}
.film-script h2{font-size:17px}
.film-script ol{display:flex; flex-direction:column; gap:2px}
.film-script li{display:block}
.film-script button{display:flex; gap:12px; width:100%; min-height:44px; padding:8px 10px; border:0; border-radius:10px; background:none; color:var(--f-dim); text-align:left}
.film-script button:hover{background:rgba(251,244,235,.06)}
.film-script button[aria-current="true"]{background:rgba(251,244,235,.09); color:var(--f-ink)}
.film-script time{flex:none; width:44px; font-variant-numeric:tabular-nums; color:var(--f-cyan)}
.film-script span{flex:1; min-width:0}
.film-script b{color:var(--f-ink); font-weight:700}

/* Column heads: who did how much. They stay lit whichever phone is in use. */
.f-hd{position:absolute; top:22px; left:0; display:flex; flex-direction:column; gap:2px; white-space:nowrap; transform-origin:0 0}
.f-hd small{font-size:24px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--f-dim); height:30px; display:flex; align-items:center; gap:12px}
.f-hd .f-logo{width:150px; height:30px}
.f-eg{padding:3px 10px 2px; border:1.5px solid rgba(251,244,235,.4); border-radius:999px; font-size:16px; letter-spacing:.12em; color:var(--f-dim)}
.f-hd div{display:flex; align-items:baseline; gap:12px; font-size:44px; font-weight:600; letter-spacing:-.01em; height:84px}
.f-hd b{display:inline-block; min-width:.56em; margin-inline:6px; text-align:center; font-size:84px; line-height:84px; font-weight:800; font-stretch:82%; letter-spacing:-.02em; font-variant-numeric:tabular-nums; transform-origin:50% 80%}
.f-hd-tom b{color:var(--f-peach)}
.f-hd-fl b{color:var(--f-cyan)}
.f-hd-cust div{font-size:52px; font-weight:740; letter-spacing:-.02em}

/* Phones */
.f-world{position:absolute; left:0; top:140px; width:1920px; height:940px; overflow:hidden}
.f-phone{position:absolute; left:0; top:-140px; transform-origin:0 0}
.f-body{width:414px; height:744px; padding:12px; border-radius:52px; background:var(--f-phone); box-shadow:inset 0 0 0 1.5px rgba(251,244,235,.24), 0 28px 70px rgba(0,0,0,.5)}
.f-screen{position:relative; width:390px; height:720px; border-radius:40px; overflow:hidden; background:var(--cream); color:var(--ink); font-size:16px; line-height:1.4}
.f-status{position:absolute; left:0; top:0; right:0; z-index:60; height:30px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 3px; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
.f-status span{display:flex; align-items:center; gap:5px}
.f-status i{display:block; width:17px; height:11px; border-radius:2px; background:currentColor; clip-path:polygon(0 70%,18% 70%,18% 100%,0 100%,0 70%,27% 45%,45% 45%,45% 100%,27% 100%,27% 45%,54% 22%,72% 22%,72% 100%,54% 100%,54% 22%,82% 0,100% 0,100% 100%,82% 100%,82% 0)}
.f-status em{display:block; width:24px; height:12px; border:1.5px solid currentColor; border-radius:4px; padding:1.5px}
.f-status em::after{content:""; display:block; width:74%; height:100%; border-radius:1.5px; background:currentColor}
.f-tap{position:absolute; z-index:65; left:0; top:0; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(32,39,62,.3); box-shadow:0 0 0 2px rgba(255,255,255,.75), 0 0 0 5px rgba(32,39,62,.25); opacity:0; pointer-events:none}
.f-press{filter:brightness(.78)}
/* The one thing on Tom's screen that matters: everything round it is dimmed */
.f-spot{position:absolute; z-index:45; left:0; top:0; width:0; height:0; border-radius:14px; box-shadow:0 0 0 2px rgba(43,126,133,.95), 0 0 0 1200px rgba(21,28,48,.46); opacity:0; pointer-events:none}
/* What Tom says or sends, shown the short way: a note leaving his phone */
.f-vn{position:absolute; z-index:58; left:20px; right:20px; bottom:104px; display:flex; justify-content:center; opacity:0; pointer-events:none}
.f-vn div{display:flex; align-items:center; gap:10px; max-width:100%; padding:11px 16px 11px 12px; border-radius:22px; background:#FFB18D; color:#20273E; font-size:18px; line-height:1.22; font-weight:650; box-shadow:0 10px 26px rgba(16,22,42,.28)}
.f-vn i{flex:none; display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:rgba(32,39,62,.14)}
.f-vn i + i{margin-left:-4px}
.f-vn svg{width:20px; height:20px}

/* The app inside Tom's phone: the same screens, held in a box */
.film-app{position:absolute; left:0; top:30px; width:390px; height:690px; overflow:hidden; display:block; background:var(--cream)}
.film-app .main{padding-bottom:calc(var(--bar) + 28px)}
.film-app .bar,.film-app .toast,.film-app .sheet-wrap{position:absolute}
.film-app .bar{padding-bottom:16px}
.film-app .sheet{padding-bottom:26px}
.film-app .home-grid,.film-app .home-grid > div{display:contents}
.film-app .rec i{height:14px}
.film-app .f-thumbs{display:flex; gap:8px}
.film-app .f-thumbs span{flex:0 1 calc((100% - 16px) / 3); aspect-ratio:1; border-radius:10px; background:linear-gradient(140deg,#c9d6d4,#8fa9a8); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.9)}

/* The customer's phone: a call, a plain message thread from the firm, and the page a link opens.
   The type is big and each message short, so one message can be taken in at a glance. */
.c-host{position:absolute; inset:0}
.c-app{position:absolute; left:0; top:0; width:390px; height:720px; display:flex; flex-direction:column; background:var(--cream)}
.c-top{flex:none; display:flex; align-items:center; gap:10px; height:58px; margin-top:30px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--card)}
.c-av{width:36px; height:36px; border-radius:50%; background:var(--teal); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none}
.c-top b{font-weight:700; line-height:1.15}
.c-top small{display:block; font-size:13px; color:var(--ink-2)}
.c-thread{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end; padding:0 12px 12px; overflow:hidden}
.c-row{display:grid; grid-template-rows:1fr; flex:none}
.c-row > div{min-height:0; overflow:hidden; display:flex; flex-direction:column}
.c-day{align-self:center; margin:12px 0 2px; padding:3px 12px; border-radius:999px; background:var(--cream-deep); color:var(--ink-2); font-size:14px; font-weight:600}
.c-b{align-self:flex-start; max-width:326px; margin-top:9px; padding:12px 14px 9px; border:1px solid var(--line); border-radius:19px 19px 19px 6px; background:var(--card); font-size:20px; line-height:1.3; transform-origin:0 100%}
.c-me .c-b{align-self:flex-end; border-color:transparent; border-radius:19px 19px 6px 19px; background:var(--teal-tint); transform-origin:100% 100%}
.c-b time{display:block; margin-top:4px; font-size:13px; color:var(--ink-2); text-align:right}
.c-link{display:flex; align-items:center; justify-content:center; gap:6px; min-height:44px; margin-top:10px; border-radius:11px; background:var(--ink); color:var(--cream); font-size:18px; font-weight:600}
.c-link .i-16{color:var(--cream)}
.c-in{flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px 18px; border-top:1px solid var(--line); background:var(--card)}
.c-in span{flex:1; height:38px; display:flex; align-items:center; padding:0 14px; border:1.5px solid var(--line-strong); border-radius:999px; color:var(--ink-2); font-size:15px}
.c-in i{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; background:var(--teal); color:#fff}
.c-call{position:absolute; inset:0; display:flex; flex-direction:column; padding:50px 16px 24px; background:#20273E; color:var(--cream)}
.c-who{flex:none; display:flex; align-items:center; gap:14px}
.c-who .c-av{width:60px; height:60px; font-size:22px}
.c-who b{display:block; font-size:24px; font-weight:740; letter-spacing:-.01em; line-height:1.15}
.c-who small{display:block; font-size:17px; color:rgba(251,244,235,.72); font-variant-numeric:tabular-nums}
.c-lines{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden; padding-top:14px}
.c-say{align-self:flex-start; max-width:322px; margin-top:10px; padding:11px 14px; border-radius:17px 17px 17px 6px; background:rgba(251,244,235,.13); font-size:19px; line-height:1.3; transform-origin:0 0}
.c-say small{display:block; margin-bottom:2px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#8FE3EF}
.c-me .c-say{align-self:flex-end; border-radius:17px 17px 6px 17px; background:rgba(255,177,141,.2); transform-origin:100% 0}
.c-me .c-say small{color:#FFC6AC}
.c-end{flex:none; align-self:center; width:62px; height:62px; border-radius:50%; background:#D94A3D; display:flex; align-items:center; justify-content:center; color:#fff}
.c-end svg{width:34px; height:34px}
.c-lock{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:130px; background:#20273E; color:rgba(251,244,235,.78)}
.c-lock b{font-size:78px; font-weight:300; letter-spacing:-.03em; color:var(--cream); line-height:1.1}
.c-page{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--cream)}
.c-bar{flex:none; display:flex; align-items:center; justify-content:space-between; height:50px; margin-top:30px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--card); font-weight:600}
.c-bar small{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2); font-weight:600}
.c-doc{flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; padding:18px 18px 0}
.c-doc h3{font-size:22px; font-weight:740; letter-spacing:-.02em}
.c-doc .total b{font-size:46px}
.c-doc .kv li{padding:9px 12px; font-size:15px}
.c-doc .btn{pointer-events:none}
.c-done{display:flex; align-items:center; gap:10px; min-height:56px; padding:0 16px; border-radius:12px; background:var(--teal-tint); font-weight:600; font-size:18px}
.c-done .i{color:var(--teal); width:24px; height:24px}
.c-note{color:var(--ink-2); font-size:14.5px}

/* Front-line's column: which of the five services this is, its name, and what was done.
   It is the only place the words are, and it does not move. */
.f-mid{position:absolute; left:0; top:150px; width:810px; height:796px; display:flex; flex-direction:column; transform-origin:0 0}
.f-chap{flex:none; height:44px; display:flex; align-items:center; gap:14px; font-size:27px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--f-cyan); white-space:nowrap}
.f-chap i{display:block; width:36px; height:3px; border-radius:2px; background:var(--f-cyan)}
.f-chap svg{width:38px; height:38px; margin-right:-2px}
.f-head{flex:none; margin-top:8px; font-size:80px; line-height:1.04; font-weight:780; font-stretch:88%; letter-spacing:-.024em; text-wrap:balance; min-height:84px}
.f-head{position:relative}
.f-head > .f-was{position:absolute; left:0; top:0; right:0}
.f-head span{display:block; text-wrap:balance}
.f-list{position:relative; flex:1; min-height:0; margin-top:22px; overflow:hidden}
.f-list-old{position:absolute; left:0; top:0; right:0; display:flex; flex-direction:column; pointer-events:none}
.f-list.over{-webkit-mask-image:linear-gradient(transparent,#000 60px); mask-image:linear-gradient(transparent,#000 60px)}
.f-list-in{display:flex; flex-direction:column}
.f-it{display:grid; grid-template-rows:1fr; flex:none}
.f-it > div{min-height:0; overflow:hidden}
.f-it p{display:flex; align-items:flex-start; gap:18px; padding:9px 0; font-size:50px; line-height:1.12; font-weight:580; letter-spacing:-.012em}
.f-it svg{flex:none; width:44px; height:44px; margin-top:6px; color:var(--f-cyan)}
.f-it small{display:block; margin:-4px 0 8px 62px; font-size:36px; line-height:1.16; font-weight:540; color:var(--f-peach); opacity:.92}
.f-it.tom p{color:var(--f-peach); font-weight:680}
.f-it.tom svg{color:var(--f-peach)}
.f-it.note p{color:var(--f-dim); font-size:38px; font-weight:500; padding-top:13px}
.f-it.note svg{display:none}
.f-it.note p::before{content:""; flex:none; width:26px; height:3px; margin:20px 8px 0 10px; border-radius:2px; background:var(--f-dim)}
.f-tl{display:flex; flex-direction:column; gap:12px; padding-top:8px}
.f-tl + .f-tl{padding-top:26px}
.f-tl small{font-size:25px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--f-dim)}
.f-tl p{display:flex; flex-wrap:wrap; gap:12px; max-width:800px}
.f-tl i{display:block; width:36px; height:36px; border-radius:50%; background:var(--f-cyan)}
.f-tl.tom i{background:var(--f-peach)}
.f-cap{flex:none; min-height:112px; display:flex; align-items:flex-end; padding-top:10px; font-size:30px; line-height:1.3; color:var(--f-dim); font-weight:500}
.f-cap span{display:block; padding-top:12px; border-top:2px solid var(--f-line); width:100%}
.film-stage.nocap .f-cap{display:none}

/* The map along the bottom: the five services, the one being shown lit */
.f-rail{position:absolute; z-index:6; left:56px; right:56px; bottom:24px; height:62px; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:18px}
.f-rail > i{display:flex; flex-direction:column; justify-content:flex-end; gap:9px; min-width:0; font-style:normal}
.f-rail span{display:flex; align-items:center; gap:10px; min-width:0; font-size:25px; font-weight:650; letter-spacing:-.005em; white-space:nowrap; color:var(--f-ink)}
.f-rail svg{flex:none; width:32px; height:32px; color:var(--f-cyan)}
.f-rail em{display:block; height:5px; border-radius:3px; background:rgba(251,244,235,.16); overflow:hidden; font-style:normal}
.f-rail b{display:block; height:100%; width:0; background:var(--f-cyan)}

/* The opening and closing cards, and the card that opens each service */
.f-card{position:absolute; z-index:4; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; text-align:center; opacity:0; pointer-events:none}
.f-card .f-logo{width:430px; height:86px}
.f-card h3{font-size:104px; line-height:1; font-weight:800; font-stretch:86%; letter-spacing:-.03em}
.f-card h3 span{display:block}
.f-card h3 em{font-style:normal; color:var(--f-cyan)}
.f-card p{font-size:58px; line-height:1.15; font-weight:560; color:var(--f-ink); max-width:1500px; text-wrap:balance}
.f-card p.dim{font-size:46px; color:var(--f-dim)}
.f-card .f-contact{display:flex; gap:40px; font-size:64px; font-weight:740; letter-spacing:-.01em; color:var(--f-ink)}
.f-card .f-contact i{display:block; width:3px; background:rgba(251,244,235,.3)}
.f-day{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding-bottom:70px; background:radial-gradient(1200px 700px at 50% 38%, var(--f-bg-2), var(--f-bg) 70%); opacity:0; pointer-events:none}
.f-day small{font-size:42px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--f-cyan)}
.f-day span{display:flex; align-items:center; justify-content:center; width:150px; height:150px; border-radius:40px; background:rgba(102,216,232,.13); color:var(--f-cyan)}
.f-day span:empty{display:none}
.f-day svg{width:96px; height:96px}
.f-day b{font-size:132px; line-height:1; font-weight:800; font-stretch:86%; letter-spacing:-.03em}

@media (max-width:700px){
  .film{padding-inline:16px}
  .film-time{margin-left:0}
}

<script>
(function () {
  'use strict';

  if (!document.documentElement.lang) document.documentElement.lang = 'en-GB';
  const app = document.getElementById('fl-app');
  const side = document.getElementById('fl-side');
  const screen = document.getElementById('fl-screen');
  const bar = document.getElementById('fl-bar');
  const toastEl = document.getElementById('fl-toast');
  const sheetEl = document.getElementById('fl-sheet');

  const DAY = 'Thursday 15 October';
  const SVC = {
    calls: { label: 'Calls & bookings', icon: 'i-calls' },
    quotes: { label: 'Quotes', icon: 'i-quote' },
    followups: { label: 'Follow-ups', icon: 'i-followup' },
    paperwork: { label: 'Job paperwork', icon: 'i-paperwork' },
    invoices: { label: 'Invoices & reminders', icon: 'i-invoice' }
  };
  const ST = {
    needs_ok: { label: 'Needs your OK', cls: 'chip-ok', icon: 'i-alert' },
    waiting: { label: 'Waiting on customer', cls: 'chip-plain', icon: 'i-clock' },
    booked: { label: 'Booked', cls: 'chip-good', icon: 'i-cal' },
    accepted: { label: 'Accepted', cls: 'chip-good', icon: 'i-check' },
    today: { label: 'On today', cls: 'chip-plain', icon: 'i-clock' },
    sent: { label: 'Sent', cls: 'chip-plain', icon: 'i-arrow' },
    overdue: { label: 'Overdue', cls: 'chip-bad', icon: 'i-alert' },
    paid: { label: 'Paid', cls: 'chip-good', icon: 'i-check' },
    urgent: { label: 'Passed to you', cls: 'chip-ok', icon: 'i-alert' }
  };
  const WHO = { fl: ['Front-line', 'who-fl'], you: ['You', 'who-you'], cust: ['Customer', 'who-cust'] };
  const KIND_SVC = { quote: 'quotes', invoice: 'invoices', extra: 'paperwork' };

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => (n < 0 ? '−' : '') + '£' + Math.abs(n).toLocaleString('en-GB');
  const icon = (id, cls) => `<svg class="${cls || 'i'}" aria-hidden="true"><use href="#${id}"></use></svg>`;
  const chip = k => `<span class="chip ${ST[k].cls}">${icon(ST[k].icon, 'i-16')}${esc(ST[k].label)}</span>`;
  const pill = (label, cls, ic) => `<span class="chip ${cls}">${icon(ic, 'i-16')}${esc(label)}</span>`;
  const tile = ic => `<span class="tile">${icon(ic, '')}</span>`;
  const chev = () => icon('i-chev', 'i chev');
  const keep = (k, v) => {
    try {
      if (v === undefined) return localStorage.getItem('fl-' + k);
      localStorage.setItem('fl-' + k, v);
    } catch (e) { /* storage is optional */ }
    return null;
  };

  let timers = [];
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

  /* ---------- example data ---------- */
  function seed() {
    return {

        <section class="block">${head('Accepted')}<div class="card">${won.map(i => jobRow(i, `${S.jobs[i].t} · ${money(S.jobs[i].q.amt)}`)).join('')}</div></section>`;

          <div class="row"><span class="txt"><span class="t1">Photo of the flue</span><span class="t2">${S.fluePhoto ? 'Added to Mrs Ahmed’s job record.' : 'Missing from Mrs Ahmed’s job record.'}</span></span>${S.fluePhoto ? pill('Added', 'chip-good', 'i-check') : '<button class="btn btn-line" data-act="sheet" data-name="send" data-id="flue">Add it</button>'}</div>

        <section class="block">${head('Deadlines')}<div class="card">
          <div class="row"><span class="txt"><span class="t1">Gas Safe: Mrs Ahmed</span><span class="t2">${S.gasSent ? 'Sent by you today.' : 'Details ready. Due by 14 November. You send it.'}</span></span>${S.gasSent ? pill('Sent', 'chip-good', 'i-check') : '<button class="btn btn-line" data-act="gas-sent">I’ve sent it</button>'}</div>
          <div class="row"><span class="txt"><span class="t1">Gas Safe: Mr Khan</span><span class="t2">Details ready. Due by 30 October. You send it.</span></span>${pill('15 days left', 'chip-plain', 'i-clock')}</div>

  function jobList() {
    const q = S.find.trim().toLowerCase();
    const ids = Object.keys(S.jobs).filter(i => !q || (S.jobs[i].c + ' ' + S.jobs[i].t + ' ' + S.jobs[i].a).toLowerCase().includes(q));
    if (!ids.length) return '<p class="empty">No job or customer matches that.</p>';

  function jobsScreen() {
    return `${backBtn()}<div class="block"><h1>All jobs</h1></div>
      <div class="field"><label for="fl-find">Find a job or a customer</label><input class="find" id="fl-find" type="search" autocomplete="off" placeholder="Name, job or street" value="${esc(S.find)}"></div>
      <div class="card" id="fl-jobs">${jobList()}</div>`;
  }

  /* ---------- sheets ---------- */
  function sheetBody() {
    const sh = S.sheet;
    const h = t => `<div class="sheet-top"><h2 id="fl-sheet-h" tabindex="-1">${esc(t)}</h2><button class="x" data-act="close" aria-label="Close">${icon('i-x')}</button></div>`;
    const done = (title, text) => `${h(title)}<div class="center"><span class="bigtick">${icon('i-check', '')}</span><p>${esc(text)}</p></div><button class="btn btn-ink btn-lg btn-block" data-act="close">Done</button>`;
    if (sh.name === 'send') {
      if (sh.step === 'rec') return `${h('Recording')}<p class="timer" id="fl-timer">0:00</p><div class="rec" aria-hidden="true">${'<i></i>'.repeat(17)}</div><button class="btn btn-ink btn-lg btn-block" data-act="send-stop">Stop and send</button><button class="btn btn-line btn-block" data-act="close">Cancel</button>`;
      if (sh.step === 'sent') return done('Got it', sh.text);
      const one = sh.id === 'flue';
      const photos = sh.photos ? `<p class="meta">${one ? '1 photo added.' : '3 photos added.'}</p><button class="btn btn-ink btn-lg btn-block" data-act="send-photos">${one ? 'Send the photo' : 'Send the photos'}</button>` : '';
      return `${h(sh.id === 'flue' ? 'Add the flue photo' : 'Send it in')}
        <p class="meta">${sh.id === 'flue' ? 'Take the photo or pick it from your phone. We add it to Mrs Ahmed’s job record.' : 'Say what happened or what the job needs. We do the rest.'}</p>
        ${sh.id === 'flue' ? '' : `<button class="btn btn-teal btn-lg btn-block" data-act="send-rec">${icon('i-mic')}Record a voice note</button>`}
        <button class="btn ${one && !sh.photos ? 'btn-teal' : 'btn-line'} btn-lg btn-block" data-act="send-add">${icon('i-camera')}${one ? (sh.photos ? 'Add another photo' : 'Add the photo') : (sh.photos ? 'Add more photos' : 'Add photos')}</button>
        ${photos}`;
    }
    if (sh.name === 'message') {
      if (sh.step === 'sent') return done('Sent', 'Sophie or Greg will come back to you.');
      return `${h('Message Sophie or Greg')}
        <div class="field"><label for="fl-msg">What do you need?</label><textarea id="fl-msg" placeholder="For example: put my day rate up to £320 from Monday."></textarea></div>
        <button class="btn btn-ink btn-lg btn-block" data-act="msg-send">Send message</button>
        <p class="meta">Or ring Greg on 07771 542157.</p>`;
    }
    if (sh.name === 'change') {
      const r = review(sh.id);
      return `${h('What needs changing?')}
        <p class="meta">${esc(r.title)}. Tell us and we bring it back for your OK.</p>
        <div class="field"><label for="fl-change">The change</label><textarea id="fl-change" placeholder="For example: take the system flush off."></textarea></div>
        <button class="btn btn-ink btn-lg btn-block" data-act="change-send" data-id="${sh.id}">Send the change</button>`;
    }
    if (sh.name === 'preview') {
      const r = review(sh.id);
      const j = S.jobs[r.job];
      return `${h('What ' + j.c + ' gets')}
        <p class="meta">A WhatsApp message from your number, in your name. A text or an email if they aren’t on WhatsApp.</p>
        <div class="bubble"><span class="t1">${esc(S.firm)}</span><p>${esc(r.msg)}</p><span class="link">${esc(r.cta)}</span></div>
        <p class="meta">The link opens this, with no login:</p>
        <div class="mini"><span class="t1">${esc(S.firm)}</span><span>${esc(r.title.replace(' for ', ' · '))}</span>
          <div class="total"><b>${money(r.total)}</b><span class="meta">including VAT</span></div>
          ${r.pay.map((p, n) => `<span class="btn ${n ? 'btn-line' : 'btn-ink'} btn-block">${esc(p)}</span>`).join('')}
        </div>`;
    }
    if (sh.name === 'settings') {
      return `${h('Example settings')}
        <p class="meta">This is an example. Change the names to show it as someone’s own firm.</p>
        <div class="field"><label for="fl-firm">Firm name</label><input id="fl-firm" type="text" autocomplete="off" value="${esc(S.firm)}"></div>
        <div class="field"><label for="fl-owner">Owner’s first name</label><input id="fl-owner" type="text" autocomplete="off" value="${esc(S.owner)}"></div>
        <button class="btn btn-ink btn-lg btn-block" data-act="settings-save">Save names</button>
        <button class="btn btn-line btn-block" data-act="reset">Start the example again</button>`;
    }
    return '';
  }

  /* ---------- render ---------- */
  function renderSide() {
    const r = S.route;
    const cur = (name, id) => (r.name === name && (id === undefined || r.id === id)) ? ' aria-current="page"' : '';
    const svc = Object.keys(SVC).map(k => {
      const n = pending({ quotes: 'quote', invoices: 'invoice', paperwork: 'extra' }[k] || '').length;
      return `<button class="nav" data-act="section" data-id="${k}"${cur('section', k)}>${icon(SVC[k].icon)}<span>${esc(SVC[k].label)}</span>${n ? `<b aria-label="${n} ${n === 1 ? 'needs' : 'need'} your OK">${n}</b>` : ''}</button>`;
    }).join('');
    side.innerHTML = `
      <div class="side-brand">
        <svg class="logo" role="img" aria-label="Front-line"><use href="#logo"></use></svg>
        <div class="side-firm"><span>${esc(S.firm)}</span><span class="badge">Example</span></div>
      </div>
      <button class="nav" data-act="home"${cur('home')}>${icon('i-home')}<span>Home</span>${S.approvals.length ? `<b aria-label="${S.approvals.length} need your OK">${S.approvals.length}</b>` : ''}</button>
      ${svc}
      <hr>
      <button class="nav" data-act="go" data-name="jobs"${cur('jobs')}>${icon('i-list')}<span>All jobs</span></button>
      <button class="nav" data-act="go" data-name="money"${cur('money')}>${icon('i-pound')}<span>Money this week</span></button>
      <button class="nav" data-act="go" data-name="rules"${cur('rules')}>${icon('i-rules')}<span>Your rules</span></button>
      <div class="side-end">
        <button class="btn btn-teal btn-lg btn-block" data-act="sheet" data-name="send">${icon('i-mic')}Send it in</button>
        <button class="btn btn-line btn-block" data-act="sheet" data-name="message">${icon('i-msg')}Message us</button>
      </div>`;
  }
  function barHTML(r) {
    if (r.name === 'review') {
      const rv = review(r.id);
      return ['actions', `<div class="bar-in">${rv.kind === 'extra'
        ? `<button class="btn btn-ink btn-lg btn-block" data-act="extra" data-v="add">Add it to the invoice</button><div class="two"><button class="btn btn-line" data-act="extra" data-v="leave">Leave it off</button><button class="btn btn-line" data-act="notyet">Not yet</button></div>`
        : `<button class="btn btn-ink btn-lg btn-block" data-act="approve" data-id="${r.id}">Approve and send</button><div class="two"><button class="btn btn-line" data-act="sheet" data-name="change" data-id="${r.id}">Change</button><button class="btn btn-line" data-act="notyet">Not yet</button></div>`}</div>`];
    }
    return ['send', `<div class="bar-in"><button class="btn btn-teal btn-lg btn-block" data-act="sheet" data-name="send">${icon('i-mic')}Send a voice note or photos</button></div>`];
  }
  function renderBar() {
    const b = barHTML(S.route);
    app.dataset.bar = b[0];
    bar.innerHTML = b[1];
  }
  function screenHTML(r) {
    return r.name === 'home' ? home()
      : r.name === 'review' ? reviewScreen(r.id)
      : r.name === 'job' ? jobScreen(r.id)
      : r.name === 'section' ? sectionScreen(r.id)
      : r.name === 'feed' ? feedScreen()
      : r.name === 'money' ? moneyScreen()
      : r.name === 'rules' ? rulesScreen()
      : jobsScreen();
  }
  function render(keepScroll) {
    const r = S.route;
    const y = window.scrollY;
    screen.className = 'screen' + (r.name === 'home' ? ' wide' : '');
    screen.innerHTML = screenHTML(r);
    renderSide();
    renderBar();
    if (keepScroll) { window.scrollTo(0, y); return; }
    window.scrollTo(0, 0);
    const h = screen.querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  function renderSheet(focus) {
    const behind = [side, screen.parentNode, bar];
    if (!S.sheet) {
      sheetEl.hidden = true; sheetEl.innerHTML = ''; document.body.style.overflow = '';
      behind.forEach(el => el.removeAttribute('inert'));
      return;
    }
    sheetEl.hidden = false;
    document.body.style.overflow = 'hidden';
    behind.forEach(el => el.setAttribute('inert', ''));
    sheetEl.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fl-sheet-h">${sheetBody()}</div>`;
    if (focus !== false) { const h = document.getElementById('fl-sheet-h'); if (h) h.focus(); }
  }

  let toastTimer = null;
  function toast(text, undo, action) {
    clearTimeout(toastTimer);
    toastEl.innerHTML = `<div class="toast-in"><span>${esc(text)}</span>${undo ? '<button class="toast-btn" data-act="undo">Undo</button>' : ''}${action ? `<button class="toast-btn" data-act="review" data-id="${action}">Review</button>` : ''}</div>`;
    toastTimer = setTimeout(() => { toastEl.innerHTML = ''; S.undo = null; }, 8000);
  }

  /* ---------- moving about ---------- */
  function go(route, fresh) {
    if (fresh) S.stack = []; else S.stack.push(S.route);
    S.route = route;
    render();
  }
  function back() {
    S.route = S.stack.pop() || { name: 'home' };
    render();
  }
  function openSheet(sheet, opener) {
    S.sheet = sheet;
    S.opener = opener || null;
    renderSheet();
  }
  function closeSheet() {
    clearInterval(S.recTimer);
    S.sheet = null;
    renderSheet();
    if (S.opener && document.contains(S.opener)) S.opener.focus();
  }

  /* ---------- changes to the example ---------- */
  const snapshot = () => { S.undo = JSON.stringify(DATA_KEYS.reduce((o, k) => { o[k] = S[k]; return o; }, {})); };
  function approve(id) {
    snapshot();
    const r = review(id);
    const j = S.jobs[r.job];
    S.approvals = S.approvals.filter(a => a !== id);
    delete S.changeAsked[id];
    if (r.kind === 'quote') {
      j.q.state = 'waiting'; j.st = 'waiting';
      j.next = 'First nudge on Sunday (day 3) if there’s no reply.';
      j.tl.push(['Today', 'Now', 'you', 'Approved the quote.'], ['Today', 'Now', 'fl', `Sent the quote: ${money(r.total)}, with a £630 deposit link.`]);
      S.feed.unshift(['Now', r.job, `Sent ${j.c} the quote for ${money(r.total)} after your OK.`]);
      toast(`Quote sent to ${j.c}.`, true);
    } else {
      j.inv = { amt: r.total, state: 'sent', note: 'Due on 29 October' }; j.st = 'sent';
      j.next = 'First reminder 7 days after it’s due. We stop when it’s paid.';
      j.tl.push(['Today', 'Now', 'you', 'Approved the invoice.'], ['Today', 'Now', 'fl', `Sent the invoice: ${money(r.total)}, with a pay-now link.`]);
      S.feed.unshift(['Now', r.job, `Sent ${j.c} the invoice for ${money(r.total)} after your OK.`]);
      toast(`Invoice sent to ${j.c}.`, true);
    }
    go({ name: 'home' }, true);
  }
  function extra(added) {
    snapshot();
    const j = S.jobs.ahmed;
    S.filter = added ? 'added' : 'left';
    S.approvals = S.approvals.map(a => a === 'x-ahmed' ? 'i-ahmed' : a);
    const total = review('i-ahmed').total;
    j.inv = { amt: total, state: 'draft' };
    j.next = 'Approve the invoice and we send it with a pay-now link.';
    j.tl.push(['Today', 'Now', 'you', added ? 'Said the filter goes on the invoice.' : 'Said to leave the filter off.'], ['Today', 'Now', 'fl', `Raised the invoice: ${money(total)}. Ready for your OK.`]);
    S.feed.unshift(['Now', 'ahmed', `Raised Mrs Ahmed’s invoice for ${money(total)}${added ? ', with the filter added' : ''}.`]);
    toast(added ? 'Filter added. Her invoice is ready for your OK.' : 'Left off. Her invoice is ready for your OK.', true);
    go({ name: 'home' }, true);
  }
  function voiceSent() {
    const first = !S.voiceUsed;
    S.voiceUsed = true;
    S.sheet = { name: 'send', step: 'sent', text: first ? 'This sounds like Mr Davies’s boiler service. We’re raising the invoice now.' : 'We’ll take it from here.' };
    renderSheet();

        r.style.opacity = p;
        r.style.transform = `translateY(${(1 - p) * 12}px)`;
        r.style.backgroundColor = `rgba(43,126,133,${.2 * glow})`;
      });
      const sp = m.spot, spP = sp && sp.w && !shOn ? eOut((t - sp.t0) / .4) : 0;
      $.spot.style.opacity = spP;
      $.spot.style.left = (sp && sp.w ? sp.x - 5 : 0) + 'px';
      $.spot.style.top = (sp && sp.w ? sp.y - 5 - (sp.inMain ? twAt(m.scroll, t) : 0) : 0) + 'px';
      $.spot.style.width = (sp && sp.w ? sp.w + 10 : 0) + 'px';
      $.spot.style.height = (sp && sp.w ? sp.h + 10 : 0) + 'px';
      const v = m.vn, vOut = v ? clamp((t - v.t0 - v.dur) / .45, 0, 1) : 0;
      $.vn.style.opacity = v ? clamp((t - v.t0) / .16, 0, 1) * (1 - vOut) : 0;
      $.vn.style.transform = v ? `translateY(${(1 - eOut((t - v.t0) / .3)) * 26 - eIO(vOut) * 50}px) scale(${.9 + .1 * eBack((t - v.t0) / .34)})` : '';
      if (v && v.typed) typeOut($.vn.querySelector('span'), t, v.from, v.typed);

      /* the customer's phone */
      const cn = eOut((t - c.nav) / .3);
      $.custHost.style.opacity = .25 + .75 * cn;
      $.custHost.style.transform = c.view === 'page' ? `translateY(${(1 - cn) * 60}px)` : '';
      $.custHost.querySelectorAll('[data-in]').forEach(r => {
        const p = eOut((t - r.dataset.in) / .42);
        if (r.dataset.fx === 'pop') { r.style.opacity = p; r.style.transform = `scale(${.9 + .1 * eBack((t - r.dataset.in) / .42)})`; return; }
        r.style.gridTemplateRows = p + 'fr';
        const b = r.firstChild.lastChild;
        b.style.opacity = p;
        b.style.transform = `scale(${.86 + .14 * eBack((t - r.dataset.in) / .45)})`;
      });
      const callP = $.custHost.querySelector('[data-call]');
      if (callP) { const sec = c.live === null ? -1 : Math.floor(t - c.live); callP.textContent = sec < 0 ? 'Calling…' : '0:' + String(sec).padStart(2, '0'); }

      /* taps */
      [['tom', $.tom, m], ['cust', $.cust, c]].forEach(([who, node, st]) => {
        const dot = node.querySelector('.f-tap'), tp = st.tap, p = tp ? (t - tp.t0) / .5 : 2;
        const old = node.querySelector('.f-press');
        if (old) old.classList.remove('f-press');
        if (p < 0 || p > 1) { dot.style.opacity = 0; dot.style.transform = ''; return; }
        dot.style.opacity = p < .18 ? p / .18 : 1 - (p - .18) / .82;
        dot.style.transform = `translate(${tp.x}px,${tp.y}px) scale(${1.25 - .4 * eOut(p)})`;
        if (p > .1 && p < .62) { const target = node.querySelector('.f-screen').querySelector(tp.sel); if (target) target.classList.add('f-press'); }
      });

      /* the middle column */
      if (s.head) {
        /* the old line fades away as the new one comes up, so the column is never empty */
        $.head.firstChild.style.opacity = 1 - clamp((t - s.head.t0) / .16, 0, 1);
        $.head.lastChild.childNodes.forEach((line, i) => {
          const p = eOut((t - s.head.t0 - .16 - i * .09) / .5);
          line.style.opacity = p;
          line.style.transform = `translateY(${(1 - p) * 24}px)`;
        });
      }
      $.chap.style.opacity = eOut((t - s.chap.t0) / .5);
      $.listIn.querySelectorAll('.f-it').forEach(r => {
        const p = eOut((t - r.dataset.in) / .45);
        /* the newest line is the one to read; the ones before it step back */
        const back = r.dataset.next === '' ? 0 : eIO((t - r.dataset.next - .25) / .7);
        r.style.gridTemplateRows = p + 'fr';
        r.firstChild.style.opacity = p * mix(1, BACK, back);
        r.firstChild.firstChild.style.transform = `translateX(${(1 - p) * -26}px)`;
        if (r.dataset.typed) typeOut(r.querySelector('small'), t, +r.dataset.from, +r.dataset.typed);
      });
      const gone = s.old ? clamp((t - s.old.t0) / .3, 0, 1) : 1;
      $.listOld.style.opacity = 1 - gone;
      $.listOld.style.transform = `translateY(${-eOut(gone) * 16}px)`;
      $.listIn.querySelectorAll('[data-pop]').forEach(d => { const p = (t - d.dataset.pop) / .3; d.style.opacity = clamp(p * 2, 0, 1); d.style.transform = `scale(${p <= 0 ? 0 : eBack(p)})`; });
      const over = $.listIn.offsetHeight - $.list.clientHeight;
      $.listIn.style.transform = `translateY(${-Math.max(0, over)}px)`;
      $.list.classList.toggle('over', over > 2);
      const cap = showCaps ? caps.find(x => t >= x.t0 && t < x.t1) : null;
      const capText = cap ? cap.text : '';
      if ($.cap.dataset.t !== capText) { $.cap.dataset.t = capText; $.cap.innerHTML = capText ? `<span>${esc(capText)}</span>` : ''; }

      /* the opening and closing cards */
      const k = s.card;
      $.cardIn.style.opacity = k && k.name === 'in' ? (k.out ? 1 - eOut((t - k.out) / .5) : 1) : 0;
      if (k && k.name === 'in') {
        const kids = $.cardIn.children;
        /* the name and the first line are there from the first frame, so a still of it is never empty */
        [-2, -2, 1.3].forEach((d, i) => { const p = eOut((t - d) / .7); kids[i].style.opacity = p; kids[i].style.transform = `translateY(${(1 - p) * 26}px)`; });
      }
      const e = k && k.name === 'end' ? k.t0 : null;
      $.cardEnd.style.opacity = e === null ? 0 : 1;
      if (e !== null) Array.from($.cardEnd.children).forEach((kid, i) => { const p = eOut((t - e - [0, .35, 1.5, 2.3, 2.9][i]) / .7); kid.style.opacity = p; kid.style.transform = `translateY(${(1 - p) * 26}px)`; });
    }

    function seek(t) {
      cur = clamp(t, 0, DUR);
      let k = 0;
      for (let i = snaps.length - 1; i >= 0; i--) if (snaps[i].at <= cur) { k = i; break; }
      if (k !== lastK) { paint(snaps[k]); lastK = k; }
      frame(snaps[k], cur);
      if (!capture) ui();
    }
    const clockText = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
    function ui() {
      const b = beats.find(x => cur < x.t1) || beats[beats.length - 1], i = beats.indexOf(b);
      $.seek.value = Math.round(cur / DUR * 1000);
      $.time.textContent = clockText(cur) + ' / ' + clockText(DUR);
      $.play.textContent = playing ? 'Pause' : cur >= DUR ? 'Play again' : 'Play';
      if ($.now.dataset.i !== String(i)) {
        $.now.dataset.i = i;
        $.now.innerHTML = `<b>Step ${i + 1} of ${beats.length}: ${esc(b.title)}</b><p>${esc(b.say)}</p>`;
        $.steps.querySelectorAll('button').forEach((btn, n) => { if (n === i) btn.setAttribute('aria-current', 'true'); else btn.removeAttribute('aria-current'); });
      }
    }
    function loop() {
      if (!playing) return;
      const t = startedFrom + (performance.now() - startedAt) / 1000;
      seek(t);
      if (t >= DUR) { playing = false; ui(); return; }
      raf = requestAnimationFrame(loop);
    }
    function play() { if (cur >= DUR) cur = 0; playing = true; startedAt = performance.now(); startedFrom = cur; cancelAnimationFrame(raf); loop(); }
    function pause() { playing = false; cancelAnimationFrame(raf); if ($) ui(); }
    function step(dir) {
      pause();
      const i = beats.findIndex(x => cur < x.t1 - .001);
      const to = dir > 0 ? beats[Math.min(beats.length - 1, i + 1)] : (cur - beats[i].t0 > 1 ? beats[i] : beats[Math.max(0, i - 1)]);
      seek(to.t0);
    }

    let fontsReady = false;
    function open(opts) {
      opts = opts || {};
      capture = !!opts.capture;
      if (opts.captions !== undefined) showCaps = !!opts.captions;
      if (S.sheet) closeSheet();
      if (!$) mount();
      build();
      caps = captions();
      $.hdTom.querySelector('small').textContent = APP.owner + ', the owner';
      $.rail.innerHTML = CHAPS.map(k => `<i><span><svg aria-hidden="true"><use href="#${SVC[k].icon}"></use></svg>${esc(SVC[k].label)}</span><em><b></b></em></i>`).join('');
      $.steps.innerHTML = beats.map((b, i) => `<li><button data-act="film-go" data-v="${i}"><time>${clockText(b.t0)}</time><span><b>${esc(b.title)}.</b> ${esc(b.say)}</span></button></li>`).join('');
      $.capsBtn.setAttribute('aria-pressed', String(showCaps));
      $.stage.classList.toggle('nocap', !showCaps);
      el.classList.toggle('capture', capture);
      app.hidden = true;
      el.hidden = false;
      document.documentElement.classList.add('film-on');
      window.scrollTo(0, 0);
      lastHTML = {}; lastK = -1; $.now.dataset.i = '';
      const ready = () => { fontsReady = true; fit(); measure(); seek(opts.at || 0); if (opts.play) play(); };
      if (document.fonts && document.fonts.ready && !fontsReady) return document.fonts.ready.then(ready);
      ready();
      return Promise.resolve();
    }
    function close() {
      pause();
      el.hidden = true;
      app.hidden = false;
      document.documentElement.classList.remove('film-on');
      if (location.hash === '#film') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* the page still works */ } }
      render();
    }

    const calm = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
    ACT.film = () => { open({ play: !calm() }); const h = el.querySelector('#fl-film-h'); if (h) h.focus({ preventScroll: true }); };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const a = b.dataset.act;
      if (a === 'film-play') { if (playing) pause(); else play(); }
      if (a === 'film-step') step(+b.dataset.v);
      if (a === 'film-go') { pause(); seek(beats[+b.dataset.v].t0); $.fit.scrollIntoView({ block: 'nearest' }); }
      if (a === 'film-caps') { showCaps = !showCaps; b.setAttribute('aria-pressed', String(showCaps)); $.stage.classList.toggle('nocap', !showCaps); seek(cur); }
      if (a === 'film-full') { try { const p = document.fullscreenElement ? document.exitFullscreen() : $.fit.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* not every viewer allows it */ } }
      if (a === 'film-close') close();
    });
    document.addEventListener('keydown', e => {
      if (el.hidden || !e.target.closest || e.target.closest('input,textarea')) return;
      if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); if (playing) pause(); else play(); }
      if (e.key === 'ArrowRight') step(1);
      if (e.key === 'ArrowLeft') step(-1);
    });
    if (location.hash === '#film') open({});
    window.addEventListener('hashchange', () => { if (location.hash === '#film' && el.hidden) open({}); });

    return { open, close, seek, play, pause, get duration() { return DUR; }, get beats() { return beats; }, get cards() { return cards; }, captions: () => caps, get snaps() { return snaps; } };
  })();
  window.__flFilm = Film;

})();
</script>
